<title>Peye-Haiti · Đặc tả màn hình bài toán Merchant — Spécification des écrans (Marchand)</title>
<style>
  :root{
    --red:#D21034; --red2:#A50D28; --redsoft:#FDEFF2;
    --hb:#00209F; --hb2:#1636C9; --hbsoft:#EEF1FE;
    --ink:#0F1B2D; --ink2:#33415C; --mut:#69758A; --line:#E3E8F1;
    --bg:#EDF0F6; --card:#ffffff; --soft:#F4F6FA;
    --m:#0A9D6C; --s:#2563eb; --c:#d97706; --w:#9ca3af;
    --wire:#98A2B3; --wirebg:#F8FAFD; --wireln:#CBD5E4;
    --sh-sm:0 1px 3px rgba(15,27,45,.05); --sh-md:0 4px 14px rgba(15,27,45,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header.top{background:linear-gradient(100deg,#0B1424 0%,#1B2A47 78%,#27334E 100%);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(6,12,24,.35)}
  header.top .logo{font-weight:800;letter-spacing:.5px;font-size:13.5px;background:linear-gradient(135deg,#E8274B,#B00D2B);padding:6px 11px;border-radius:9px;box-shadow:0 4px 12px rgba(210,16,52,.35)}
  header.top h1{font-size:15px;margin:0;font-weight:700;line-height:1.3}
  header.top h1 small{display:block;font-weight:400;opacity:.65;font-size:11.5px;font-style:italic}
  .spacer{flex:1}
  .langtog{display:flex;gap:0;border:1px solid rgba(255,255,255,.28);border-radius:9px;overflow:hidden;backdrop-filter:blur(4px)}
  .langtog button{background:transparent;color:#fff;border:0;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
  .langtog button.on{background:var(--red)}
  .layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
  /* sidebar */
  aside{width:300px;flex:none;padding:14px 10px 60px;position:sticky;top:60px;max-height:calc(100vh - 60px);overflow:auto}
  .compsec{margin-bottom:9px;background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--sh-sm)}
  .comphd{padding:10px 13px;font-weight:800;font-size:12.5px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
  .comphd small{font-weight:500;opacity:.85;font-size:10.5px;font-style:italic}
  .comphd .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:20px;padding:1px 8px;font-size:11px}
  .c0 .comphd{background:linear-gradient(120deg,#0995DD,#0369A1)}.c1 .comphd{background:linear-gradient(120deg,#8B5CF6,#6D28D9)}.c2 .comphd{background:linear-gradient(120deg,#0AA2BF,#0E7490)}.c3 .comphd{background:linear-gradient(120deg,#F43F5E,#BE123C)}.c4 .comphd{background:linear-gradient(120deg,#10B981,#047857)}.c5 .comphd{background:linear-gradient(120deg,#64748B,#334155)}
  .scrlist{display:none}.compsec.open .scrlist{display:block}
  .scritem{padding:7px 12px 7px 14px;font-size:12px;border-top:1px solid var(--soft);cursor:pointer;display:flex;align-items:center;gap:7px;line-height:1.25;transition:background .12s}
  .scritem:hover{background:var(--soft)}
  .scritem.sel{background:var(--redsoft);border-left:3px solid var(--red);padding-left:11px}
  .scritem .pid{font-size:9.5px;color:var(--mut);font-weight:700;font-family:ui-monospace,monospace;flex:none}
  .scritem .pdot{width:9px;height:9px;border-radius:50%;flex:none}
  .scritem .nm{flex:1}.scritem .nm i{display:block;font-style:italic;color:var(--mut);font-size:10.5px}
  /* main */
  main{flex:1;padding:18px 22px 80px;min-width:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .filters .f{font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:700;color:var(--ink2);box-shadow:var(--sh-sm);transition:all .15s}
  .filters .f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-left:auto}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  /* screen detail */
  .detail{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:24px;align-items:start}
  .device-wrap{position:sticky;top:78px}
  .phone{width:306px;margin:0 auto;background:linear-gradient(155deg,#39435C 0%,#131B2C 45%,#0A101E 100%);border-radius:44px;padding:12px;box-shadow:0 30px 70px rgba(10,16,30,.40),inset 0 1.5px 1px rgba(255,255,255,.14)}
  .phone .screen{background:#fff;border-radius:33px;overflow:hidden;height:598px;display:flex;flex-direction:column}
  .browser{background:linear-gradient(155deg,#39435C,#0A101E);border-radius:16px;padding:9px;box-shadow:0 24px 60px rgba(10,16,30,.35)}
  .browser .bar{display:flex;gap:5px;padding:3px 5px 8px}
  .browser .bar i{width:9px;height:9px;border-radius:50%;background:#5B6478}
  .browser .bar i:first-child{background:#F16A5D}.browser .bar i:nth-child(2){background:#F5BF4F}.browser .bar i:nth-child(3){background:#62C554}
  .browser .screen{background:#fff;border-radius:10px;overflow:hidden;min-height:480px}
  .dvtag{text-align:center;font-size:11px;color:var(--mut);margin-top:10px;font-weight:600}
  /* wireframe blocks */
  .wf{padding:0;font-size:12px;color:var(--ink)}
  .phone .screen .wf{flex:1;display:flex;flex-direction:column;min-height:0}
  .wf-status{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#001A82,#00209F);color:#fff;padding:7px 17px 3px;font-size:8.6px;font-weight:600;letter-spacing:.4px;position:relative}
  .wf-status::after{content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);width:66px;height:13px;background:#0A101E;border-radius:999px}
  .wf-appbar{background:linear-gradient(180deg,#00209F,#031C8C);color:#fff;padding:12px 14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
  .wf-appbar small{font-weight:400;opacity:.75;font-style:italic;font-size:10px}
  .wf-appbar .bk{opacity:.85;cursor:pointer}
  .wf-body{padding:13px;display:flex;flex-direction:column;gap:10px;flex:1;background:linear-gradient(180deg,#F7F8FC 0%,#F1F3F9 100%);overflow-y:auto;min-height:0}
  .wf-body::-webkit-scrollbar{width:4px}
  .wf-body::-webkit-scrollbar-thumb{background:#C9D2E2;border-radius:4px}
  .wf-body>*{flex:none}
  .wf-field{border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:#fff;box-shadow:var(--sh-sm)}
  .wf-field .lb{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.2px}
  .wf-field .lb i{font-style:italic;opacity:.8}
  .wf-field .val{color:var(--wire);font-size:11.5px;margin-top:2px}
  .wf-btn{border-radius:13px;padding:11px 10px;text-align:center;font-weight:800;font-size:12px;cursor:pointer;transition:transform .12s,box-shadow .15s,filter .15s;user-select:none}
  .wf-btn:active{transform:scale(.97)}
  .wf-btn.pri{background:linear-gradient(135deg,#3557F0 0%,#1636C9 55%,#00209F 100%);color:#fff;box-shadow:0 7px 16px rgba(0,32,159,.32),inset 0 1px 0 rgba(255,255,255,.22)}
  .wf-btn.pri:hover{filter:brightness(1.06)}
  .wf-btn.sec{background:#fff;border:1.5px solid #D3DAE7;color:var(--ink);box-shadow:var(--sh-sm)}
  .wf-btn.sec:hover{border-color:#B9C3D6}
  .wf-btn.ghost{background:transparent;color:var(--ink2);border:1.5px dashed var(--wireln)}
  .wf-btn small{display:block;font-weight:500;opacity:.85;font-size:9.5px;font-style:italic}
  .wf-amount{text-align:center;padding:10px}
  .wf-amount .big{font-size:31px;font-weight:800;color:var(--ink);letter-spacing:.3px;font-variant-numeric:tabular-nums}
  .wf-amount .sub{font-size:10.5px;color:var(--mut);font-style:italic}
  .wf-qr{width:124px;height:124px;margin:8px auto 6px;border:0;border-radius:14px;background:
    repeating-linear-gradient(45deg,#101B30 0 6px,#fff 6px 12px);opacity:.92;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 7px #fff,0 0 0 8.5px var(--line),0 10px 24px rgba(15,27,45,.14);cursor:pointer}
  .wf-qr span{background:#fff;padding:3px 8px;font-size:9px;font-weight:800;border-radius:6px;box-shadow:0 1px 4px rgba(15,27,45,.18);line-height:1.35;text-align:center}
  .wf-card{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:linear-gradient(170deg,#FFFFFF,#FBFCFE);box-shadow:var(--sh-sm)}
  .wf-card .k{font-size:9.5px;color:var(--mut);font-weight:700;letter-spacing:.2px}
  .wf-card .v{font-size:14px;font-weight:800;margin-top:3px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .wf-row{display:flex;gap:9px}
  .wf-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh-sm)}
  .wf-list .li{padding:9px 12px;border-bottom:1px solid #F1F4F9;display:flex;align-items:center;gap:10px;font-size:11.5px;transition:background .12s}
  .wf-list .li:hover{background:#FAFBFE}
  .wf-list .li:last-child{border-bottom:0}
  .wf-list .li .ic{width:29px;height:29px;border-radius:10px;background:linear-gradient(160deg,#F3F5FA,#E8EDF5);flex:none;display:flex;align-items:center;justify-content:center;font-size:13.5px;box-shadow:inset 0 0 0 1px rgba(15,27,45,.04)}
  .wf-list .li .tx{flex:1;line-height:1.3}.wf-list .li .tx i{font-style:italic;color:var(--mut);font-size:10px;display:block}
  .wf-list .li .rt{font-weight:800;color:var(--ink);font-size:11px}
  .wf-tabs{display:flex;gap:4px;background:#E8ECF3;border:1px solid #E0E5EE;border-radius:13px;padding:4px;overflow:visible}
  .wf-tabs div{flex:1;text-align:center;padding:7px 4px;font-size:10.5px;font-weight:700;color:var(--mut);border-right:0;border-radius:10px;transition:all .15s}
  .wf-tabs div.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(15,27,45,.14)}
  .wf-tabs div:last-child{border-right:0}
  .wf-chart{height:98px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;align-items:flex-end;gap:7px;padding:10px 12px;box-shadow:var(--sh-sm)}
  .wf-chart b{flex:1;background:linear-gradient(180deg,#5B79F7,#1636C9);border-radius:5px 5px 2px 2px;opacity:.85}
  .wf-photo{height:120px;border:2px dashed var(--wireln);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;background:var(--wirebg);text-align:center;flex-direction:column;gap:5px}
  .wf-photo .em{font-size:26px;opacity:.65}
  .wf-text{font-size:10.5px;color:var(--mut);line-height:1.45;padding:0 2px}
  .wf-acct{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #B8E6D2;border-radius:999px;background:linear-gradient(135deg,#EAFBF3,#DFF6EC);font-size:10.5px;cursor:pointer;box-shadow:0 1px 3px rgba(10,157,108,.12);transition:box-shadow .15s}
  .wf-acct:hover{box-shadow:0 3px 8px rgba(10,157,108,.18)}
  .wf-acct .tx{flex:1;font-weight:800;color:#0B5C42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wf-acct .st{font-size:9px;background:linear-gradient(135deg,#10B27B,#088A5E);color:#fff;border-radius:999px;padding:2.5px 8px;font-weight:800;white-space:nowrap;box-shadow:0 1px 3px rgba(8,138,94,.3)}
  .wf-acct .ch{color:#57A88E;font-weight:800}
  .wf-text i{font-style:italic}
  .wf-badge{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 9px;border-radius:20px}
  .wf-pin{display:flex;gap:10px;justify-content:center;padding:7px}
  .wf-pin b{width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#3557F0,#001C8C);display:inline-block;box-shadow:0 2px 5px rgba(0,32,159,.3)}
  .wf-pin b.o{background:#fff;border:2px solid #C9D2E2;box-shadow:none}
  .wf-nav{display:flex;border-top:1px solid #ECEFF5;background:#fff;margin-top:auto;padding:4px 0 6px}
  .wf-nav div{flex:1;text-align:center;padding:6px 2px;font-size:8.7px;color:#8D97AB;line-height:1.25;font-weight:600;cursor:pointer}
  .wf-nav div .e{font-size:16px;display:block;filter:grayscale(.35);opacity:.8}
  .wf-nav div.on{color:var(--hb);font-weight:800}
  .wf-nav div.on .e{filter:none;opacity:1}
  .wf-toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:13px;padding:9px 12px;font-size:11.5px;background:#fff;box-shadow:var(--sh-sm)}
  .wf-toggle .sw{width:36px;height:20px;border-radius:20px;background:linear-gradient(135deg,#12B37E,#089565);position:relative;transition:background .15s;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
  .wf-toggle .sw::after{content:"";position:absolute;right:2.5px;top:2.5px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:all .15s}
  .wf-table{width:100%;border-collapse:collapse;font-size:10.5px}
  .wf-table th{background:#F5F7FB;text-align:left;padding:7px 9px;font-weight:800;color:var(--ink2);border-bottom:1px solid var(--line);letter-spacing:.2px}
  .wf-table td{padding:7px 9px;border-bottom:1px solid #F1F4F9;color:var(--ink2)}
  .wf-side{display:flex;gap:0;min-height:100%}
  .wf-side .nav{width:110px;background:linear-gradient(175deg,#101B30,#1A2740);color:#fff;padding:10px 0;flex:none}
  .wf-side .nav .it{padding:8px 11px;font-size:10px;opacity:.65;line-height:1.3;cursor:pointer;transition:opacity .12s}
  .wf-side .nav .it:hover{opacity:.9}
  .wf-side .nav .it.on{opacity:1;border-left:3px solid var(--red);background:rgba(255,255,255,.09);font-weight:700}
  .wf-side .nav .it i{font-style:italic;font-size:8.5px;display:block;opacity:.8}
  .wf-side .ct{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;background:linear-gradient(180deg,#F8F9FC,#F2F4F9)}
  /* annotation panel */
  .anno h2{font-size:20px;margin:0 0 2px;letter-spacing:-.2px}
  .anno .fr-h,.anno .en-h{font-style:italic;color:var(--mut);font-size:13px;margin-bottom:10px;font-weight:500}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;box-shadow:var(--sh-sm)}
  .chip.pri{color:#fff}
  .chip.dep{background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .chip.ch{background:#EEF2FF;color:#3730A3}
  .chip.off{background:#ECFDF5;color:#065F46}
  .chip.gd1{background:linear-gradient(135deg,#E8274B,#B00D2B);color:#fff}
  .chip.gd2{background:#E2E8F0;color:#475569}
  .gdm{margin-left:auto;flex:none;font-size:8.5px;font-weight:800;border-radius:8px;padding:1px 5px;background:#E2E8F0;color:#64748B}
  .gdm.g1{background:#FBE3E8;color:#D21034}
  .block{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 18px;margin-bottom:13px;box-shadow:var(--sh-sm)}
  .block h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--red2);margin:0 0 9px}
  .block p{margin:0 0 6px;font-size:13px;line-height:1.55;color:var(--ink2)}
  .block p i{color:var(--mut)}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .io .col h4{font-size:11px;color:var(--mut);margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
  ul.rules{margin:0;padding-left:18px}
  ul.rules li{font-size:12.5px;line-height:1.55;margin-bottom:6px;color:var(--ink2)}
  ul.rules li i{color:var(--mut);font-style:italic;display:block;font-size:11px}
  ul.flat{list-style:none;padding:0;margin:0}
  ul.flat li{font-size:12px;padding:5px 0;border-bottom:1px dashed var(--soft);color:var(--ink2)}
  ul.flat li i{color:var(--mut);font-style:italic;font-size:10.5px;display:block}
  .home-hero{background:linear-gradient(115deg,#0B1424 0%,#1C2B4A 62%,#3B2038 100%);color:#fff;border-radius:20px;padding:28px 30px;margin-bottom:18px;box-shadow:0 14px 40px rgba(11,20,36,.28),inset 0 0 90px rgba(0,32,159,.16)}
  .home-hero h2{margin:0 0 6px;font-size:24px;letter-spacing:-.3px}
  .home-hero p{margin:0;opacity:.88;font-size:13.5px;line-height:1.65;max-width:760px}
  .home-hero p i{font-style:italic;opacity:.75}
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}

  .ovcard h3{margin:0 0 3px;font-size:15px}
  .ovcard .fr,.ovcard .en{font-style:italic;color:var(--mut);font-size:11.5px;margin-bottom:9px}

  .note b{color:#5A4209}
  .crumb{font-size:11.5px;color:var(--mut);margin-bottom:6px}
  .crumb b{color:var(--ink)}
  /* ---- ngôn ngữ: lang-vn / lang-fr ---- */

  svg .fr,svg .en{font-style:italic}

   purpose:{vn:"Chỉ QR Transfer theo đúng bộ chuẩn Napas đã ban hành (EMVCo — QR do người bán trình) — QR tĩnh (standee in 1 lần) hoặc QR động kèm số tiền. Tiền ghi Có thẳng tài khoản nhận của merchant qua Switch BRH; MMS ngoài đường tiền, nhận biết giao dịch qua báo có Open Banking (M4). Payload đã chứa định danh merchant nên mã in một lần dùng lâu dài.",fr:"QR Transfer uniquement, selon la norme Napas publiée (EMVCo) — statique (standee imprimé une fois) ou dynamique avec montant. L'argent crédite directement le compte du marchand via le Switch BRH ; le MMS, hors du flux, est notifié par Open Banking (M4). Le payload contient l'identifiant marchand : le QR imprimé sert durablement.",en:"QR Transfer only, per the published Napas standard (EMVCo) — static (print-once standee) or dynamic with amount. Money credits straight to the merchant account via the BRH Switch; the MMS, outside the flow, is notified via Open Banking (M4). The payload carries the merchant identity, so one printed QR lasts.",ht:"QR Transfer sèlman, selon nòm Napas ki pibliye a (EMVCo) — estatik (standee enprime yon fwa) oswa dinamik ak montan. Lajan an kredite dirèkteman kont machann nan atravè Switch BRH la ; MMS la, deyò sikwi a, resevwa notifikasyon atravè Open Banking (M4). Payload la gen idantifyan machann nan : QR ki enprime a sèvi lontan."},

     {vn:"Hiển thị rõ hàng đợi đồng bộ offline (cốt lõi cho bối cảnh 2G/điện chập chờn).",fr:"File de synchro visible (essentiel en 2G/électricité instable).",en:"Clearly shows the offline sync queue (core for 2G/unstable-power context).",ht:"Lis senkwonizasyon vizib (esansyèl ak 2G/kouran enstab)."},{vn:"ĐỔI TÀI KHOẢN NHẬN: OTP chủ TK mới (bank xác thực quyền sở hữu) → thu hồi token cũ (M1b), cấp token mới (M1), sinh QR mới + in lại standee — TK cũ giữ liên kết 30 ngày (OLD_LINK_GRACE) nên không mất giao dịch nào.",fr:"CHANGEMENT DE COMPTE : OTP du nouveau titulaire (propriété validée par la banque) → révocation de l&#39;ancien token (M1b), nouveau token (M1), nouveau QR + standee réimprimé — ancien compte lié 30 jours (OLD_LINK_GRACE), aucune transaction perdue.",en:"ACCOUNT CHANGE: new holder OTP (ownership validated by the bank) → revoke old token (M1b), issue a new one (M1), new QR + reprinted standee — the old account stays linked 30 days (OLD_LINK_GRACE), no transaction lost.",ht:"CHANJMAN KONT : OTP nouvo pwopriyetè a (bank lan valide pwopriyete a) → ansyen token nan revoke (M1b), nouvo token (M1), nouvo QR + standee reenprime — ansyen kont lan rete konekte 30 jou (OLD_LINK_GRACE), okenn tranzaksyon pa pèdi."},{vn:"Gia hạn token là việc của HỆ THỐNG: backend tự làm mới trước hạn qua M1a — người bán KHÔNG thao tác. Chỉ khi liên kết mất hiệu lực (bank thu hồi / không gia hạn được) app mới báo và dẫn đi liên kết lại bằng OTP (NB-2B).",fr:"Le renouvellement du token est GÉRÉ PAR LE SYSTÈME (M1a automatique) — aucune action du marchand. Ce n&#39;est que si la liaison devient invalide (révoquée / non renouvelable) que l&#39;app propose de relier par OTP (NB-2B).",en:"Token renewal is the SYSTEM's job: the backend refreshes it before expiry via M1a — the merchant does NOTHING. Only when a link becomes invalid (revoked / unrenewable) does the app prompt to relink by OTP (NB-2B).",ht:"Se SISTÈM NAN ki jere renouvèlman token nan (M1a otomatik) — machann nan pa gen anyen pou l fè. Se sèlman si koneksyon an vin pa valab (revoke / pa ka renouvle) app la pwopoze rekonekte ak OTP (NB-2B)."},{vn:"Pilot: 1 gian hàng = 1 số điện thoại chủ. Sau 10/2026: thêm vai trò thu ngân chỉ-xem-báo-có, không được đổi tài khoản nhận.",fr:"Pilote : 1 boutique = 1 numéro du propriétaire. Après 10/2026 : rôle caissier en lecture seule, sans droit de changer le compte.",en:"Pilot: 1 shop = 1 owner phone. After 10/2026: a cashier role that only sees credit notices and cannot change the account.",ht:"Pilòt : 1 boutik = 1 nimewo pwopriyetè a. Apre 10/2026 : wòl kesye an lekti sèlman, san dwa chanje kont lan."},

   purpose:{vn:"Màn hình mở đầu của hồ sơ Client trong CHÍNH app Peye-Haiti: người mua quét mã QR của người bán (in trên standee hoặc QR động trên máy người bán). App tự đọc chuỗi QR chuẩn HTQR ngay trên máy — QR động thì số tiền lấy từ QR và khóa lại; QR tĩnh thì người mua tự nhập. Bấm tiếp tục, server tra danh bạ và trả về TÊN người bán đã xác thực để xác nhận ở màn sau (chống QR dán đè).",fr:"Écran d&#39;entrée du profil Client dans la MÊME app Peye-Haiti : l&#39;acheteur scanne le QR du marchand (standee imprimé ou QR dynamique à l&#39;écran du marchand). L&#39;app lit la chaîne QR HTQR sur l&#39;appareil — QR dynamique : montant lu du QR et verrouillé ; QR statique : montant saisi par l&#39;acheteur. Au « Continuer », le serveur interroge l&#39;annuaire et renvoie le NOM vérifié du marchand pour confirmation à l&#39;écran suivant (anti-collage de QR).",en:"Entry screen of the Client profile inside the SAME Peye-Haiti app: the buyer scans the merchant&#39;s QR (printed standee or on-screen dynamic QR). The app decodes the HTQR string on-device — dynamic QR: amount comes from the QR and is locked; static QR: the buyer types it. On continue, the server looks up the directory and returns the merchant&#39;s VERIFIED NAME for confirmation on the next screen (anti QR-swap).",ht:"Ekran antre pwofil Kliyan an nan MENM app Peye-Haiti a : achtè a eskane QR machann nan (standee enprime oswa QR dinamik sou ekran machann nan). App la li chèn QR HTQR a sou aparèy la — QR dinamik : montan an soti nan QR a epi li bloke ; QR estatik : achtè a antre l. Lè ou peze kontinye, sèvè a chèche nan anyè a epi li retounen NON machann nan ki verifye pou konfimasyon nan ekran ki vini an (kont QR kole sou lòt)."},

     {vn:"Sóng yếu: gửi lại dùng CÙNG mã chống trùng — không bao giờ sinh lệnh mới cho cùng một lần quét; server chặn lệnh thứ hai tới cùng đích, cùng số tiền khi lệnh cũ chưa chốt.",fr:"Réseau faible : la reprise réutilise le MÊME identifiant anti-doublon — jamais de nouvel ordre pour le même scan ; le serveur bloque un second ordre vers la même destination, du même montant, tant que le premier n&#39;est pas dénoué.",en:"Weak signal: the retry reuses the SAME anti-duplicate id — never a new order for the same scan; the server blocks a second order to the same target and amount while the first is unsettled.",ht:"Rezo fèb : lè li eseye ankò li itilize MENM idantifyan kont doublon an — pa janm yon nouvo lòd pou menm eskane a ; sèvè a bloke yon dezyèm lòd pou menm destinasyon an ak menm montan an toutotan premye a poko fini."},
     {vn:"Người mua chỉ cần định danh mức KYC1 (SĐT + OTP) — không chụp giấy tờ; hạn mức theo khung BRH cho mức này.",fr:"L&#39;acheteur n&#39;a besoin que du niveau KYC1 (téléphone + OTP) — aucune pièce à photographier ; plafonds selon le cadre BRH de ce niveau.",en:"The buyer only needs KYC1 (phone + OTP) — no document photos; limits per the BRH framework for that tier.",ht:"Achtè a bezwen sèlman nivo KYC1 (telefòn + OTP) — pa gen foto dokiman ; limit yo dapre kad BRH pou nivo sa a."},

   rules:[
     {vn:"Tên hiển thị lấy từ DANH BẠ Peye-Haiti (nguồn sự thật) khi tài khoản đích đã xác thực — không lấy từ chuỗi QR.",fr:"Le nom affiché vient de l&#39;ANNUAIRE Peye-Haiti (source de vérité) quand le compte est vérifié — jamais de la chaîne QR.",en:"The displayed name comes from the Peye-Haiti DIRECTORY (source of truth) when the account is verified — never from the QR string.",ht:"Non ki parèt la soti nan ANYÈ Peye-Haiti la (sous verite) lè kont lan verifye — pa janm nan chèn QR a."},
     {vn:"Sai PIN 5 lần → khóa 60 phút (quy tắc chung của app). Quyền nguồn trả bị định chế thu hồi → app báo và dẫn sang NM-05 liên kết lại.",fr:"5 PIN erronés → blocage 60 minutes (règle commune de l&#39;app). Consentement révoqué par l&#39;institution → l&#39;app le signale et renvoie vers NM-05 pour rétablir la liaison.",en:"5 wrong PINs → 60-minute lock (app-wide rule). Consent revoked by the institution → the app says so and routes to NM-05 to re-link.",ht:"5 PIN ki pa bon → bloke 60 minit (règ jeneral app la). Enstitisyon an revoke konsantman an → app la di sa epi li voye w nan NM-05 pou konekte ankò."},
     {vn:"Còn một lệnh chưa chốt tới CÙNG đích, cùng số tiền → server từ chối lệnh mới và app hiện lệnh đang chờ — chống trả hai lần.",fr:"S&#39;il reste un ordre non conclu vers la MÊME destination et le même montant → le serveur refuse le nouvel ordre et l&#39;app montre l&#39;ordre en attente — anti double paiement.",en:"If an unsettled order to the SAME target and amount exists → the server rejects the new one and the app shows the pending order — anti double-pay.",ht:"Si gen yon lòd ki poko fini pou MENM destinasyon an ak menm montan an → sèvè a refize nouvo a epi app la montre lòd k ap tann nan — kont peye de fwa."},
     {vn:"Số tài khoản đích KHÔNG ghi xuống đĩa — chỉ giữ tạm tối đa 15 phút để chuyển tiếp sang định chế trả rồi xóa; hệ thống chỉ lưu bản che (…7709).",fr:"Le compte destinataire n&#39;est JAMAIS écrit sur disque — gardé au plus 15 minutes pour le relais vers l&#39;institution payeuse puis effacé ; seul un masque (…7709) est conservé.",en:"The target account is NEVER written to disk — held at most 15 minutes for the relay to the paying institution, then wiped; only a masked form (…7709) is kept.",ht:"Kont destinasyon an PA JANM ekri sou disk — li kenbe 15 minit maksimòm pou relè a bay enstitisyon k ap peye a, apre sa li efase ; se sèlman yon vèsyon maske (…7709) ki rete."}],

   bar:{vn:"Kết quả thanh toán",fr:"Résultat du paiement",en:"Payment result",ht:"Rezilta peman an", bk:true},
   purpose:{vn:"Định chế trả báo kết quả về Peye-Haiti (webhook M-PAY-hook) — app hiện thành công/thất bại trong ≤3 giây và sinh biên lai số — mã biên lai dẫn xuất từ mã tham chiếu giao dịch (qua Switch: RefID; nội bộ một định chế: mã lệnh rút gọn). Người BÁN vẫn nhận «ting ting» qua kênh báo có riêng và đơn được gạch như luồng chuẩn — hai phía độc lập, không phụ thuộc app người mua.",fr:"L&#39;institution payeuse notifie Peye-Haiti (webhook M-PAY-hook) — l&#39;app affiche succès/échec en ≤3 secondes et produit le reçu numérique — sa référence dérive de la référence de transaction (via Switch : RefID ; interne à une institution : identifiant d&#39;ordre abrégé). Le MARCHAND reçoit son « ting ting » par son propre canal d&#39;avis de crédit et l&#39;addition est soldée comme d&#39;habitude — les deux côtés sont indépendants.",en:"The paying institution notifies Peye-Haiti (M-PAY-hook webhook) — the app shows success/failure within ≤3 seconds and issues the digital receipt — its reference derives from the transaction reference (via Switch: RefID; within one institution: shortened order id). The MERCHANT still gets the “ting ting” through their own credit-notice channel and the bill is cleared as usual — both sides are independent.",ht:"Enstitisyon k ap peye a notifye Peye-Haiti (webhook M-PAY-hook) — app la montre siksè/echèk nan ≤3 segonn epi li bay resi nimerik la — referans li soti nan referans tranzaksyon an (atravè Switch : RefID ; anndan yon sèl enstitisyon : idantifyan lòd kout). MACHANN nan toujou resevwa « ting ting » li nan pwòp kanal avi kredi li, epi adisyon an efase jan sa toujou fèt — de bò yo endepandan."},

     {t:"text",vn:"💠 «v3.5» Món TRÊN 5.000 G: trước khi có kết quả, màn này chuyển sang TRẠNG THÁI NHẬP OTP — định chế NGUỒN đã nhắn mã tới +509****3456 (SMS của ĐỊNH CHẾ, không phải Peye-Haiti); món ≤ 5.000 G chỉ cần PIN, không qua bước này.",fr:"💠 « v3.5 » Montant AU-DELÀ de 5 000 G : avant le résultat, cet écran passe en MODE SAISIE OTP — l&#39;institution SOURCE a envoyé le code au +509****3456 (SMS de l&#39;INSTITUTION, pas de Peye-Haiti) ; ≤ 5 000 G : PIN seul, pas cette étape.",en:"💠 v3.5 Amounts ABOVE 5,000 G: before the result, this screen switches to OTP-ENTRY MODE — the SOURCE institution texted the code to +509****3456 (the INSTITUTION&#39;s SMS, not Peye-Haiti&#39;s); ≤ 5,000 G: PIN only, this step is skipped.",ht:"💠 « v3.5 » Montan PI WO pase 5 000 G : anvan rezilta a, ekran sa a pase nan MÒD ANTRE OTP — enstitisyon SOUS la voye kòd la nan +509****3456 (SMS ENSTITISYON an, pa Peye-Haiti) ; ≤ 5 000 G : sèl PIN, pa gen etap sa a."},

     {t:"btn",k:"pri",vn:"Xác nhận OTP",fr:"Confirmer l&#39;OTP",en:"Confirm OTP",ht:"Konfime OTP a",eff:{vn:"Đã chuyển OTP sang định chế nguồn (API chuẩn hóa) — chờ kết quả cuối; sai mã: định chế báo số lần thử còn lại, sai quá số lần thì lệnh thất bại",fr:"OTP transmis à l&#39;institution source (API normalisée) — en attente du résultat ; code erroné : l&#39;institution renvoie les essais restants, trop d&#39;erreurs = ordre rejeté",en:"OTP forwarded to the source institution (standardized API) — awaiting the final result; wrong code: the institution returns remaining attempts, too many failures = order fails",ht:"OTP a ale nan enstitisyon sous la (API nòmalize) — n ap tann rezilta final la ; kòd ki pa bon : enstitisyon an di konbyen esè ki rete, twòp erè = lòd la tonbe"}},
     {t:"text",vn:"Quá 3 giây chưa có kết quả → app hiện «đang xử lý» và tự hỏi lại — tuyệt đối KHÔNG tạo lệnh mới (nhánh OTP: đồng hồ tính lại từ lúc nộp mã). Thất bại → hiện lý do (thiếu số dư · từ chối · vượt hạn mức · sai OTP quá số lần) và KHÔNG sinh biên lai.",fr:"Au-delà de 3 secondes sans résultat → l&#39;app affiche « en cours » et réinterroge l&#39;institution — JAMAIS de nouvel ordre (branche OTP : le chronomètre repart à la soumission du code). En cas d&#39;échec → motif affiché (solde insuffisant · refus · plafond · OTP erroné trop de fois) et AUCUN reçu.",en:"Past 3 seconds without a result → the app shows “processing” and re-polls — NEVER a new order (OTP branch: the clock restarts when the code is submitted). On failure → the reason shows (insufficient funds · declined · limit · too many wrong OTPs) and NO receipt is issued.",ht:"Depase 3 segonn san rezilta → app la montre « ap trete » epi li mande ankò — li PA JANM kreye yon nouvo lòd (branch OTP : revèy la rekòmanse lè w soumèt kòd la). Si li echwe → rezon an parèt (lajan pa ase · refize · limit · twòp move OTP) epi PA GEN resi."},

   rules:[
     {vn:"«Thành công»/«thất bại» là trạng thái CUỐI, không đổi nữa; kết quả mâu thuẫn tới sau chỉ mở hồ sơ đối soát — không lật kết quả đã hiện.",fr:"« Réussi »/« échoué » est un état FINAL, immuable ; un résultat contradictoire tardif ouvre un dossier de rapprochement — sans renverser l&#39;affichage.",en:"“Succeeded”/“failed” is a FINAL, immutable state; a late conflicting result opens a reconciliation case — it never flips what was shown.",ht:"« Siksè »/« echèk » se yon eta FINAL, li pa chanje ; yon rezilta ki vin apre epi ki kontredi ouvri yon dosye rapwochman — li pa chanje sa ki te parèt la."},
     {vn:"«Đang xử lý» là trạng thái tạm — quá 60 giây chưa có kết quả, hệ thống tự hỏi lại định chế trả; kết quả về muộn vẫn cập nhật đúng vào lịch sử và bắn thông báo.",fr:"« En cours » est temporaire — sans résultat après 60 secondes, le système réinterroge l&#39;institution payeuse ; un résultat tardif met correctement à jour l&#39;historique et notifie.",en:"“Processing” is temporary — with no result after 60 seconds the system re-queries the paying institution; a late result still updates history correctly and notifies.",ht:"« Ap trete » se yon eta tanporè — san rezilta apre 60 segonn, sistèm nan mande enstitisyon k ap peye a ankò ; yon rezilta ki vin ta toujou mete istorik la ajou epi voye notifikasyon."},
     {vn:"Người bán nhận báo có và gạch đơn qua luồng chuẩn bên nhận — không phụ thuộc app người mua (mất mạng phía mua không ảnh hưởng người bán).",fr:"Le marchand reçoit l&#39;avis de crédit et solde l&#39;addition par le flux standard côté récepteur — indépendant de l&#39;app acheteur (une coupure côté acheteur n&#39;affecte pas le marchand).",en:"The merchant receives the credit notice and clears the bill through the standard receiving flow — independent of the buyer app (a buyer-side outage never affects the merchant).",ht:"Machann nan resevwa avi kredi a epi li efase adisyon an nan chemen nòmal bò k ap resevwa a — endepandan de app achtè a (pàn bò achtè a pa afekte machann nan)."}],

   purpose:{vn:"Người mua xem lại mọi khoản đã trả (chỉ của chính mình), mở lại biên lai và khiếu nại một khoản ngay trong app. Khiếu nại sinh hồ sơ nguồn «app người mua» đi vào cùng hàng đợi xử lý với khiếu nại của người bán — phản hồi đầu trong 24 giờ và theo dõi được trạng thái.",fr:"L&#39;acheteur revoit tous ses paiements (les siens uniquement), rouvre les reçus et conteste un paiement directement dans l&#39;app. La réclamation crée un dossier de source « app acheteur » qui rejoint la même file de traitement que celles des marchands — première réponse sous 24 h, statut suivi dans l&#39;app.",en:"The buyer reviews all payments (their own only), reopens receipts and disputes a payment right in the app. A dispute creates a case sourced “buyer app” that joins the same handling queue as merchant complaints — first response within 24 h, status trackable in-app.",ht:"Achtè a wè tout peman li yo (pa li sèlman), li ouvri resi yo ankò epi li fè reklamasyon sou yon peman dirèkteman nan app la. Reklamasyon an kreye yon dosye sous « app achtè » ki antre nan menm liy tretman ak plent machann yo — premye repons nan 24 è, ou ka swiv estati a nan app la."},

    else{num++;var x1=X[r.from],x2=X[r.to],dir=x2>=x1?1:-1;var col=r.d?'#94a3b8':'#EE0033';

}

        '<div class="api-note"><b><span class="vn">Quy ước cốt lõi:</span><span class="fr">Conventions clés :</span><span class="en">Key conventions:</span><span class="ht">Konvansyon kle yo :</span></b> <span class="vn">Mỗi giao dịch có MỘT mã tham chiếu (RefID) do Switch sinh — biên lai, đối soát, tra soát, hoàn tiền đều bám mã này · Luôn 2 bước: HỎI (đúng người/đúng đơn) rồi mới CHUYỂN TIỀN · Bảo mật API: JWT + ký/mã hóa thông điệp · Đặc tả chính thức theo BRH/ACI.</span><span class="fr">Un RefID unique par transaction (généré par le Switch) — reçus, rapprochement, litiges et remboursements s&#39;y réfèrent · Toujours 2 étapes : INTERROGER puis VIRER · Sécurité API : JWT + signature/chiffrement · Spécifications officielles BRH/ACI.</span><span class="en">One Switch-generated reference (RefID) per transaction — receipts, reconciliation, disputes and refunds all key on it · Always 2 steps: INQUIRE, then TRANSFER · API security: JWT + message signing/encryption · Official specs per BRH/ACI.</span><span class="ht">Yon RefID inik pa tranzaksyon (Switch la jenere l) — resi, rekonsilyasyon, litij ak ranbousman refere ak li · Toujou 2 etap : MANDE ENFO apre sa TRANSFERE · Sekirite API : JWT + siyati/chifreman · Espesifikasyon ofisyèl BRH/ACI.</span></div>'+

 {g:"1",vn:"Năng lực nội bộ MMS (KHÔNG yêu cầu bank/ví cung cấp)",fr:"Capacités internes du MMS (RIEN à demander aux banques/wallets)",en:"MMS internal capabilities (NOTHING required from banks/wallets)",ht:"Kapasite entèn MMS la (PA GEN ANYEN pou mande bank/wallet yo)",items:[
      {id:"I2",vn:"Sinh QR nhận tiền (QR Transfer) — TỰ SINH, không cần API",fr:"Générer le QR de virement — AUTONOME, aucune API requise",en:"Generate receiving QR (QR Transfer) — SELF-GENERATED, no API needed",ht:"Jenere QR transfè a — OTONÒM, pa bezwen okenn API",m:"internal",sc:"QR EMVCo/Napas",scr:"NB-04 · MMS",ph:"perm",p:{vn:"MMS tự sinh payload EMVCo theo bộ chuẩn Napas từ số TK thụ hưởng + số tiền — KHÔNG cần bank/ví cung cấp API nào; MMS cũng KHÔNG tham gia khi giao dịch chạy.",fr:"Le MMS génère lui-même le payload EMVCo (norme Napas) à partir du compte + montant — AUCUNE API bancaire requise ; le MMS n'intervient pas pendant la transaction.",en:"The MMS self-generates the EMVCo payload per the Napas standard from account + amount — NO bank/wallet API required; the MMS also stays out of the running transaction.",ht:"MMS la jenere payload EMVCo a (nòm Napas) poukont li apati kont + montan — PA BEZWEN OKENN API bank ; MMS la pa entèvni pandan tranzaksyon an."}},

 {g:"2",vn:"Open Banking — bank/ví nhận PHẢI cung cấp: 6 endpoint (C.1–C.6) + webhook báo có M4 ≥50 TPS",fr:"Open Banking — la banque de règlement DOIT fournir : 6 endpoints (C.1–C.6) + webhook de crédit M4 ≥50 TPS",en:"Open Banking — the settlement bank/wallet MUST provide: 6 endpoints (C.1–C.6) + credit webhook M4 ≥50 TPS",ht:"Open Banking — bank règleman an DWE bay : 6 endpoint (C.1–C.6) + webhook kredi M4 ≥50 TPS",items:[
   {id:"M1",vn:"Liên kết tài khoản nhận tiền đã có → cấp TOKEN",fr:"Liaison d'un compte existant → délivrance du TOKEN",en:"Link an existing settlement account → issue TOKEN",ht:"Koneksyon yon kont ki deja egziste → TOKEN delivre",m:"POST · OAuth2 consent",sc:"account.link → token[balance · history · credit-notify] (refresh · revoke)",scr:"NB-2B",ph:"perm",p:{vn:"Liên kết tài khoản: bank gửi OTP tới chủ TK để xác nhận quyền sở hữu. Thành công → cấp TOKEN consent gắn với tài khoản: phạm vi lịch sử (M3) + báo có (M4). Vòng đời token: hết hạn · refresh · thu hồi.",fr:"Liaison du compte : la banque envoie un OTP au titulaire pour confirmer la propriété. Succès → TOKEN de consentement lié au compte : portée historique (M3) + avis de crédit (M4). Cycle de vie : expiration · refresh · révocation.",en:"Account linking: the bank sends an OTP to the holder to confirm ownership. Success → a consent TOKEN bound to the account: scope history (M3) + credit notices (M4). Token lifecycle: expiry · refresh · revocation.",ht:"Koneksyon kont lan : bank lan voye yon OTP bay pwopriyetè a pou konfime posesyon an. Siksè → TOKEN konsantman lye ak kont lan : pòte istorik (M3) + avi kredi (M4). Sik lavi : ekspirasyon · refresh · revokasyon."}},
   {id:"M1a",vn:"Gia hạn token (refresh) — backend tự động",fr:"Renouvellement du token (refresh) — automatique côté backend",en:"Token renewal (refresh) — automatic on the backend",ht:"Renouvèlman token (refresh) — otomatik bò backend",m:"POST",sc:"token.refresh",scr:"AQ-00",ph:"perm",p:{vn:"Backend TỰ làm mới token trước hạn — người bán không thao tác, không thấy khái niệm token. Token chết là mất «ting ting» hàng loạt, nên refresh thất bại → cảnh báo trực ban (AQ-01) + app đề nghị liên kết lại bằng OTP (NB-2B).",fr:"Le backend renouvelle le token AUTOMATIQUEMENT avant échéance — aucune action du marchand. Un token invalide = plus d&#39;avis de crédit ; si le refresh échoue → alerte d&#39;astreinte (AQ-01) + l&#39;app propose de relier par OTP (NB-2B).",en:"The backend refreshes tokens before expiry ON ITS OWN — merchants do nothing and never see the token concept. A dead token means mass loss of “ting ting”, so a failed refresh → on-call alert (AQ-01) + the app proposes relinking by OTP (NB-2B).",ht:"Backend lan renouvle token nan OTOMATIKMAN anvan li ekspire — machann nan pa gen anyen pou l fè. Yon token ki pa valab = pa gen avi kredi ankò ; si refresh la echwe → alèt ekip gad (AQ-01) + app la pwopoze rekonekte ak OTP (NB-2B)."}},
   {id:"M1b",vn:"Thu hồi token (revoke)",fr:"Révocation du token",en:"Token revoke",ht:"Revokasyon token nan",m:"POST",sc:"token.revoke",scr:"NB-14 · BRH-04",ph:"perm",p:{vn:"Thu hồi khi: đổi tài khoản nhận, nghi gian lận, tạm khóa/đóng gian hàng. Thu hồi xong mọi truy vấn M3/M4 của token cũ phải bị từ chối ngay.",fr:"Révoqué si : changement de compte, suspicion de fraude, suspension/fermeture. Après révocation, toute requête M3/M4 de l&#39;ancien token est refusée immédiatement.",en:"Revoked on: settlement-account change, suspected fraud, suspension/closure. After revocation every M3/M4 call with the old token must fail immediately.",ht:"Revoke si : chanjman kont, sispèk fwod, sispansyon/fèmti. Apre revokasyon, tout demann M3/M4 ansyen token nan refize imedyatman."}},
   {id:"M2",vn:"Ghi Có tài khoản merchant — đường chuyển tiền của Switch, KHÔNG phải API tích hợp",fr:"Crédit du compte marchand — RAIL du switch, PAS une API à intégrer",en:"Credit merchant account — switch RAIL, NOT an integration API",ht:"Kredi kont machann nan — RAY switch la, se PA yon API pou entegre",m:"rail switch",sc:"rail Switch (ACI)",scr:"NB-05",ph:"perm",p:{vn:"Ngữ cảnh: tiền ghi Có thẳng vào tài khoản merchant qua Switch giữa các ngân hàng/ví — MMS không gọi và không phục vụ API này; chỉ NHẬN hệ quả qua M4.",fr:"Contexte : le crédit passe par le Switch entre institutions — le MMS n'appelle ni ne sert cette interface ; il n'en reçoit que l'effet via M4.",en:"Context: the credit flows over the Switch between institutions — the MMS neither calls nor serves this; it only learns the outcome via M4.",ht:"Kontèks : kredi a pase nan Switch la ant enstitisyon yo — MMS la pa rele ni pa sèvi entèfas sa a ; li sèlman resevwa efè a atravè M4."}},
   {id:"M3",vn:"Truy vấn số dư & lịch sử giao dịch (đối soát)",fr:"Solde & historique des transactions (rapprochement)",en:"Balance & transaction history query (reconciliation)",ht:"Balans & istorik tranzaksyon (rekonsilyasyon)",m:"GET",sc:"balance.read · history.read",scr:"NB-09 · AQ-00",ph:"perm",p:{vn:"Đọc số dư & lịch sử giao dịch tài khoản đã liên kết BẰNG TOKEN (M1) — hiển thị ở màn «Lịch sử giao dịch» (NB-09), đối soát ở «Đầu nối Open Banking» (AQ-00); dùng để phục hồi webhook sót và xác minh hoàn — KHÔNG còn là một mức gạch bill.",fr:"Lire l'historique des transactions du compte lié AVEC LE TOKEN (M1) — affichage à l'écran « Historique » (NB-09), rapprochement au « Connecteur Open Banking » (AQ-00) ; sert à la reprise des webhooks manqués et à la vérification des remboursements — ce n&#39;est PLUS un niveau de lettrage.",en:"Read the linked account transaction history USING THE TOKEN (M1) — display on the History screen (NB-09), AQ-00 reconciliation; used for missed-webhook recovery and refund verification — NO longer a bill-matching level.",ht:"Li istorik tranzaksyon kont ki konekte a AK TOKEN NAN (M1) — afiche nan ekran « Istorik » (NB-09), rekonsilyasyon nan « Konektè Open Banking » (AQ-00) ; li sèvi pou ratrape webhook ki manke yo ak pou verifye ranbousman — se PA yon nivo matching ankò."}},
   {id:"M4",vn:"Báo có realtime (webhook)",fr:"Notification de crédit (webhook)",en:"Real-time credit notice (webhook)",ht:"Notifikasyon kredi (webhook)",m:"POST webhook + subscribe",sc:"notification.credit · webhook.manage",scr:"NB-05 · AQ-00",ph:"perm",p:{vn:"Bank/ví nhận bắn sự kiện ghi Có realtime về MMS → 'ting ting' người bán (I5) + gạch bill. Đường găng của trải nghiệm; dự phòng: truy vấn sao kê định kỳ (M3). Báo có PHẢI kèm thông tin người trả (số điện thoại ví / tên chủ TK) — phục vụ biên lai qua SMS cho người mua và gạch bill.",fr:"La banque de règlement notifie le crédit en temps réel au MMS → notification marchand (I5) + lettrage. Chemin critique ; repli : relevés périodiques (M3). L'avis DOIT porter les informations du payeur (numéro du wallet / nom du titulaire) — pour les reçus SMS au client et le lettrage.",en:"The settlement bank/wallet pushes real-time credit events to the MMS → merchant 'ting ting' (I5) + bill matching. the critical path of the 'ting ting' experience; fallback M3 statement polling. The notice must carry PAYER info (wallet phone number / account holder name) — feeds buyer SMS receipts and bill matching.",ht:"Bank règleman an notifye kredi a an tan reyèl bay MMS la → notifikasyon machann (I5) + matching. Chemen kritik ; sekou : relve peryodik (M3). Avi a DWE pote enfòmasyon moun ki peye a (nimewo wallet / non pwopriyetè) — pou resi SMS bay kliyan an ak pou matching."}},
   
   
 ]},
 {g:"3",vn:"Open Banking — định chế TRẢ: phụ lục hợp đồng D2 «Peye-Haiti 15/08» (khi bật hồ sơ Người mua)",fr:"Open Banking — institution PAYEUSE : avenant au contrat D2 « Peye-Haiti 15/08 » (à l&#39;activation du profil Acheteur)",en:"Open Banking — PAYING institution: D2 contract annex “Peye-Haiti 15/08” (when the Buyer profile turns on)",ht:"Open Banking — enstitisyon K AP PEYE : anèks kontra D2 « Peye-Haiti 15/08 » (lè pwofil Achtè a limen)",items:[
   {id:"M-PAY",vn:"Khởi tạo lệnh trả & tra trạng thái (2 endpoint)",fr:"Créer l&#39;ordre de paiement & consulter son état (2 endpoints)",en:"Create the payment order & query its state (2 endpoints)",ht:"Kreye lòd peman an & tcheke eta li (2 endpoint)",m:"POST/GET · consent OAuth2 scope payment",sc:"payments (create · status)",scr:"NM-02 · NM-03",ph:"perm",p:{vn:"Người mua bấm xác nhận → MMS gọi định chế TRẢ tạo lệnh (số TK đích từ QR chỉ CHUYỂN TIẾP, không lưu); định chế chuyển tiền theo đường hiện hữu (Switch hoặc nội bộ) — tiền không chạm Peye-Haiti. Quá 60 giây chưa có kết quả → MMS gọi endpoint trạng thái để hỏi lại.",fr:"L&#39;acheteur confirme → le MMS demande à l&#39;institution PAYEUSE de créer l&#39;ordre (le compte destinataire du QR n&#39;est que RELAYÉ, jamais stocké) ; l&#39;institution vire par les rails existants (Switch ou interne) — l&#39;argent ne touche pas Peye-Haiti. Sans résultat après 60 secondes → le MMS interroge l&#39;endpoint d&#39;état.",en:"The buyer confirms → the MMS asks the PAYING institution to create the order (the QR&#39;s target account is only RELAYED, never stored); the institution moves money over existing rails (Switch or on-us) — funds never touch Peye-Haiti. No result after 60 seconds → the MMS queries the status endpoint.",ht:"Achtè a konfime → MMS la mande enstitisyon K AP PEYE a kreye lòd la (kont destinasyon QR a sèlman PASE, li pa janm sere) ; enstitisyon an deplase lajan an sou ray ki deja egziste yo (Switch oswa entèn) — lajan an pa manyen Peye-Haiti. San rezilta apre 60 segonn → MMS la mande endpoint eta a."}},
   {id:"M-PAY-hook",vn:"Webhook KẾT QUẢ trả về Peye-Haiti",fr:"Webhook du RÉSULTAT vers Peye-Haiti",en:"RESULT webhook back to Peye-Haiti",ht:"Webhook REZILTA a tounen bay Peye-Haiti",m:"POST · JWS ký/signé",sc:"payment-results",scr:"NM-03 · NM-04",ph:"perm",p:{vn:"Định chế trả báo kết quả cuối (thành công/thất bại + lý do) — mục tiêu tổng ≤3 giây từ lúc bấm trả; bắn trùng không đổi kết quả đã chốt; bên NHẬN vẫn nhận báo có M4 độc lập như cũ.",fr:"L&#39;institution payeuse notifie le résultat final (réussi/échoué + motif) — objectif ≤3 secondes de bout en bout ; un doublon ne change jamais un résultat définitif ; le côté RÉCEPTEUR reçoit son avis de crédit M4 indépendamment, comme avant.",en:"The paying institution posts the final result (succeeded/failed + reason) — end-to-end target ≤3 seconds; duplicates never change a settled result; the RECEIVING side still gets its M4 credit notice independently, as before.",ht:"Enstitisyon k ap peye a voye rezilta final la (siksè/echèk + rezon) — objektif total ≤3 segonn ; yon doublon pa janm chanje yon rezilta ki fini ; bò K AP RESEVWA a toujou jwenn avi kredi M4 li poukont li, jan sa te ye."}}
 ]},
 {g:"4",vn:"BRH & Switch — API do BRH/Switch cung cấp cho MMS",fr:"BRH & Switch — API fournies par la BRH/le Switch au MMS",en:"BRH & Switch — APIs provided by BRH/Switch to the MMS",ht:"BRH & Switch — API BRH/Switch la bay MMS la",items:[
   {id:"E1",vn:"Định danh điện tử (eKYC)",fr:"Identification électronique (eKYC)",en:"Electronic identification (eKYC)",ht:"Idantifikasyon elektwonik (eKYC)",m:"POST",sc:"ekyc.verify",scr:"NB-2A · BRH-03",ph:"perm",p:{vn:"Đối chiếu ảnh thẻ CIN + selfie của người bán với dữ liệu định danh quốc gia (ONI) — trả kết quả khớp/không khớp để hệ thống kích hoạt gian hàng và mở quyền nhận tiền. BRH cung cấp; cần đặc tả & môi trường thử trong tháng 7/2026.",fr:"Compare la photo de la carte CIN + le selfie du marchand aux données nationales (ONI) — renvoie concordance/non-concordance pour l&#39;activation. Fournie par la BRH ; spécifications &amp; bac à sable attendus en juillet 2026.",en:"Matches the merchant&#39;s CIN card photo + selfie against the national identity data (ONI) — returns match/no-match so the system can activate the shop and enable payouts. Provided by BRH; specs &amp; sandbox needed by July 2026.",ht:"Konpare foto kat CIN nan + selfie machann nan ak done nasyonal yo (ONI) — li retounen konkòdans/pa-konkòdans pou aktivasyon an. BRH ki bay li ; espesifikasyon &amp; sandbox prevwa pou jiyè 2026."}},
   {id:"E2",vn:"Sàng lọc phòng chống rửa tiền (AML) — đã có ✓",fr:"Filtrage anti-blanchiment (AML) — disponible ✓",en:"Anti-money-laundering screening (AML) — available ✓",ht:"Filtraj kont blanchiman lajan (AML) — disponib ✓",m:"POST",sc:"aml.screen",scr:"NB-2A · BRH-05",ph:"perm",p:{vn:"Kiểm tra người bán khi định danh và giao dịch bất thường khi giám sát với danh sách rủi ro của BRH. API đã sẵn sàng.",fr:"Vérifie le marchand à l&#39;identification et les transactions atypiques en supervision, au regard des listes de risque de la BRH. API déjà disponible.",en:"Checks merchants at onboarding and unusual transactions during monitoring against BRH risk lists. API already available.",ht:"Verifye machann nan lè idantifikasyon ak tranzaksyon ki pa nòmal yo nan sipèvizyon, parapò ak lis risk BRH yo. API a deja disponib."}}

   {id:"E3",vn:"Bảng kê cuối ngày từ Switch (EOD)",fr:"Relevé de fin de journée du Switch (EOD)",en:"End-of-day statement from the Switch (EOD)",ht:"Relve fen jounen Switch la (EOD)",m:"GET (API) · SFTP dự phòng",sc:"switch.eod",scr:"AQ-03 · AQ-04",ph:"perm",p:{vn:"Bảng kê 3 phiên/ngày để đối soát: đối chiếu từng khoản báo có với dòng của Switch, khoản lệch xử trong 2 ngày làm việc. Cũng là lưới đỡ khi webhook sót (cùng M3-poll).",fr:"Relevé 3 sessions/jour pour le rapprochement : chaque avis de crédit est confronté aux lignes du Switch, écarts traités sous 2 jours ouvrés. Sert aussi de filet de sécurité quand le webhook manque (avec M3-poll).",en:"Statement 3 sessions/day for reconciliation: each credit notice is matched against Switch lines, discrepancies closed within 2 business days. Also the safety net for missed webhooks (with M3-poll).",ht:"Relve 3 sesyon/jou pou rekonsilyasyon : chak avi kredi konpare ak liy Switch yo, diferans trete anvan 2 jou travay. Li sèvi tou kòm filè sekirite lè webhook la manke (ak M3-poll)."}},

iddle" font-size="8.2" font-weight="500" fill="#166534">API do BRH cung cấp</text><text class="fr" x="750" y="270" text-anchor="middle" font-size="8.2" font-weight="500" fill="#166534">API fournies par la BRH</text><text class="en" x="750" y="270" text-anchor="middle" font-size="8.2" font-weight="500" fill="#166534">APIs provided by BRH</text><text class="ht" x="750" y="270" text-anchor="middle" font-size="7.1" style="font-size:7.1px" font-weight="500" fill="#166534">API BRH bay</text><text class="vn" x="672" y="290" text-anchor="start" font-size="8.8" font-weight="700" fill="#166534">• eKYC — đối chiếu CIN/ONI</text><text class="fr" x="672" y="290" text-anchor="start" font-size="8.8" font-weight="700" fill="#166534">• eKYC — vérification CIN/ONI</text><text class="en" x="672" y="290" text-anchor="start" font-size="8.8" font-weight="700" fill="#166534">• eKYC — CIN/ONI check</text><text class="ht" x="672" y="290" text-anchor="start" font-size="7.5" style="font-size:7.5px" font-weight="700" fill="#166534">• eKYC — verif. CIN/ONI</text><text class="vn" x="672" y="308" text-anchor="start" font-size="8.8" font-weight="700" fill="#166534">• AML — sàng lọc ✓ đã có</text><text class="fr" x="672" y="308" text-anchor="start" font-size="8.8" font-weight="700" fill="#166534">• AML — filtrage ✓ disponible</text><text class="en" x="672" y="308" text-anchor="start" font-size="8.8" font-weight="700" fill="#166534">• AML — screening ✓ available</text><text class="ht" x="672" y="308" text-anchor="start" font-size="7.5" style="font-size:7.5px" font-weight="700" fill="#166534">• AML — filtraj ✓ disponib</text><line x1="545" y1="140" x2="660" y2="250" stroke="#5b6472" stroke-width="1.6" marker-end="url(#apA)"/><text class="vn" x="590" y="206" text-anchor="middle" font-size="8.6" font-weight="700" fill="#374151">eKYC · AML (nhóm 4)</text><text class="fr" x="590" y="206" text-anchor="middle" font-size="8.6" font-weight="700" fill="#374151">eKYC · AML (groupe 4)</text><text class="en" x="590" y="206" text-anchor="middle" font-size="8.6" font-weight="700" fill="#374151">eKYC · AML (group 4)</text><text class="ht" x="590" y="206" text-anchor="middle" font-size="7.3" style="font-size:7.3px" font-weight="700" fill="#374151">eKYC · AML (gwoup 4)</text></svg></div>'+
    '<div class="api-note"><b>🧭 <span class="vn">Mô hình:</span><span class="fr">Modèle :</span><span class="en">Model:</span><span class="ht">Modèl :</span></b> <span class="vn">Peye-Haiti = <b>hệ thống quản lý điểm bán dùng chung quốc gia (MMS — Merchant Management System)</b>. Phạm vi tài liệu = <b>footprint T10/2026: chỉ QR Transfer</b> — MMS ngoài đường tiền; trọng tâm tích hợp là <b>nhóm 2 Open Banking</b> với bank/ví NHẬN tiền (NatCash + 1 bank đối tác). Nhóm 1 là năng lực nội bộ (tự sinh QR + báo có cho người bán); nhóm 3 là Open Banking với định chế TRẢ (M-PAY — dùng khi bật hồ sơ Người mua «Peye-Haiti 15/08»); nhóm 4 là API do <b>BRH và Switch</b> cung cấp (eKYC · AML · bảng kê cuối ngày); nhóm 5 là hạ tầng viễn thông do <b>Natcom</b> cung cấp (SMS liên mạng). Phía sau BFF, MMS chia <b>4 dịch vụ</b> (Merchant &amp; Identity · Commerce (gồm module Ingest) · Back-office (Compliance + Admin &amp; Config) · Notification), sự kiện nội bộ chạy trên <b>Kafka</b>. Các mã như <b>NB-2A</b> là MÃ MÀN HÌNH trong đặc tả (NB = App người bán · NM = App người mua · BRH = Portal BRH · VI = Ví liên thông · AQ = Vận hành) — bấm mã ở cột "Màn hình liên quan" để mở màn tương ứng. Nghiệp vụ THAM CHIẾU bộ chuẩn kỹ thuật Napas (TCKT 2.0) — kết nối thật bằng API theo đặc tả BRH/ACI; chuẩn QR quốc gia = copy bộ Napas.</span><span class="fr-blk" style="display:none"><i>Peye-Haiti = MMS national partagé. Périmètre = empreinte oct. 2026 : QR Transfer seul — intégration clé = groupe 2 Open Banking avec la banque de règlement; groupe 3 = Open Banking de l&#39;institution payeuse (M-PAY — profil Acheteur « Peye-Haiti 15/08 ») ; groupe 4 = API fournies par le BRH-System (eKYC · AML) ; groupe 5 = infrastructure télécom de <b>Natcom</b> (SMS inter-réseaux). Derrière le BFF, le MMS compte <b>4 services</b> (Merchant &amp; Identity · Commerce (module Ingest inclus) · Back-office (Compliance + Admin &amp; Config) · Notification), événements internes via <b>Kafka</b>. Les codes comme <b>NB-2A</b> sont des codes d&#39;ÉCRAN de cette spécification (NB = app marchand · NM = app acheteur · BRH = portail BRH · VI = wallets · AQ = exploitation) — cliquez-les dans la colonne « Écrans liés ». Référence métier Napas; connexion réelle par API selon BRH/ACI.</i></span><span class="en-blk"><i>Peye-Haiti = shared national MMS. Scope = Oct 2026 footprint: QR Transfer only — key integration = group 2 Open Banking with the settlement bank; group 3 = paying-institution Open Banking (M-PAY — Buyer profile, “Peye-Haiti 15/08”); group 4 = APIs provided by BRH-System (eKYC · AML); group 5 = telecom rails from <b>Natcom</b> (cross-network SMS). Behind the BFF the MMS runs <b>4 services</b> (Merchant &amp; Identity · Commerce (incl. the Ingest module) · Back-office (Compliance + Admin &amp; Config) · Notification), internal events on <b>Kafka</b>. Codes like <b>NB-2A</b> are SCREEN codes in this spec (NB = merchant app · NM = buyer app · BRH = BRH portal · VI = wallets · AQ = operations) — click them in the "Related screens" column to open the screen. Business references Napas; the real connection is API per BRH/ACI specs.</i></span><span class="ht-blk"><i>Peye-Haiti = MMS nasyonal pataje. Perimèt = anprent okt. 2026 : QR Transfer sèlman — entegrasyon kle = gwoup 2 Open Banking ak bank règleman an ; gwoup 3 = Open Banking enstitisyon k ap peye a (M-PAY — pwofil Achtè « Peye-Haiti 15/08 ») ; gwoup 4 = API BRH-System bay (eKYC · AML) ; gwoup 5 = ray telekòm <b>Natcom</b> (SMS tout rezo). Dèyè BFF la, MMS la gen <b>4 sèvis</b> (Merchant &amp; Identity · Commerce (ak modil Ingest la) · Back-office (Compliance + Admin &amp; Config) · Notification), evènman entèn sou <b>Kafka</b>. Kòd tankou <b>NB-2A</b> se kòd EKRAN nan espesifikasyon sa a (NB = app machann · NM = app achtè · BRH = pòtay BRH · VI = wallet · AQ = operasyon) — klike sou yo nan kolòn « Ekran ki gen rapò » pou ouvri ekran an. Biznis la refere ak Napas ; vrè koneksyon an se API selon espesifikasyon BRH/ACI.</i></span></div>'+
    groups+
    '<div class="api-note"><b>6 · <span class="vn">Quy ước xuyên suốt</span><span class="fr">Conventions transversales</span><span class="en">Cross-cutting conventions</span><span class="ht">Konvansyon jeneral</span>:</b> <span class="vn">Mỗi giao dịch có MỘT mã RefID do Switch sinh, dùng suốt vòng đời — đối soát, tra soát, hoàn tiền đều gọi theo mã này · Mọi giao dịch 2 bước: HỎI trước (tên/đơn) rồi mới CHUYỂN TIỀN · Bảo mật API: JWT + ký/mã hóa JWS/JWE, Mutual SSL · Một endpoint chung · Chỉ hoàn tiền khi lỗi nghiệp vụ tường minh; lỗi kỹ thuật hạ tầng tuyệt đối không tự hoàn · Đặc tả chính thức theo BRH/ACI; nghiệp vụ tham chiếu mô hình Napas TCKT 2.0.</span><span class="fr-blk" style="display:none"><i>Un RefID unique par transaction (généré par le Switch) pour tout le cycle · Toujours 2 étapes : INTERROGER puis VIRER · Sécurité API : JWT + JWS/JWE, Mutual SSL · Endpoint unique · Remboursement uniquement sur erreur métier explicite · Spécifications officielles BRH/ACI; référence métier Napas TCKT 2.0.</i></span><span class="en-blk"><i>One Switch-generated RefID per transaction for the whole lifecycle — reconciliation, disputes and refunds all key on it · Every transaction is 2-step: INQUIRE first, then TRANSFER · API security: JWT + JWS/JWE, Mutual SSL · Single endpoint · Refund only on explicit business errors; never auto-refund on infrastructure (5xx) errors · Official specs from BRH/ACI; business reference: Napas TCKT 2.0.</i></span><span class="ht-blk"><i>Yon sèl RefID Switch la jenere pou chak tranzaksyon pandan tout sik lavi a — rekonsilyasyon, litij ak ranbousman tout kore sou li · Chak tranzaksyon fèt an 2 etap : MANDE ENFO anvan, apre sa TRANSFERE · Sekirite API : JWT + JWS/JWE, Mutual SSL · Yon sèl endpoint · Ranbousman sèlman sou erè biznis eksplisit ; pa janm fè ranbousman otomatik sou erè enfrastrikti (5xx) · Espesifikasyon ofisyèl BRH/ACI ; referans biznis : Napas TCKT 2.0.</i></span></div>'+
    '</div>';
  location.hash='api';window.scrollTo(0,0);window.CURID=null;updPos();
}

  if(!t){t=({vn:'Hành động demo — hệ thống sẽ gọi API tương ứng.',fr:'Action de démonstration — l&#39;API correspondante est appelée.',en:'Demo action — the corresponding API is called.',ht:'Aksyon demo — sistèm nan ap rele API ki koresponn nan.'})[l];}
  var d=document.getElementById('toast');d.innerHTML=t;d.className='show';
  clearTimeout(window.__tt);window.__tt=setTimeout(function(){d.className='';},2400);}
function fmtG(v){v=String(Math.max(0,Math.round(v)));return v.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');}
function amtInp(el){var v=parseInt(String(el.value).replace(/\D/g,''))||0;
  var pane=el.closest('.wf-pane')||el.closest('.wf-body')||document;var ds=pane.querySelectorAll('.dynamt');for(var i=0;i<ds.length;i++){ds[i].textContent=fmtG(v);}}
function goCtx(el,id,g,ix,src){var amt=null;
  if(typeof src==='number'){amt=src;}
  else if(src){var w=el.closest('.wf-body')||document;var s=w.querySelector(src);if(s)amt=parseInt(String(s.textContent).replace(/\D/g,''))||0;}
  gotoScr(id);
  var tab=document.querySelector('.wf-tabs div[data-g="'+g+'"][data-ix="'+ix+'"]');if(tab)tabsel(tab);
  if(amt!=null){var inp=document.querySelector('.amtedit input');if(inp){inp.value=amt;amtInp(inp);}}}
function biCalc(el){var w=el.closest('.wf-body')||document;var rows=w.querySelectorAll('.wf-bill .bi');var t=0,n=0;
  for(var i=0;i<rows.length;i++){var r=rows[i];var on=r.getAttribute('data-on')==='1';var p=parseInt(r.getAttribute('data-p'))||0;var q=parseInt(r.getAttribute('data-q'))||0;
    r.querySelector('.ln').textContent=fmtG(p*q)+' G';if(on){t+=p*q;n++;}}
  var bt=w.querySelectorAll('.btot');for(var k=0;k<bt.length;k++){bt[k].textContent=fmtG(t)+(bt[k].closest('.bill-total')?' G':'');}
  var bc=w.querySelector('.bcnt');if(bc)bc.textContent=n;}
function biTgl(el){var r=el.closest('.bi');var on=r.getAttribute('data-on')==='1';r.setAttribute('data-on',on?'0':'1');r.classList.toggle('on',!on);el.textContent=on?'\u2610':'\u2611';biCalc(el);}
function biQ(el,d){var r=el.closest('.bi');var q=Math.max(1,(parseInt(r.getAttribute('data-q'))||1)+d);r.setAttribute('data-q',q);r.querySelector('.qty i').textContent=q;if(r.getAttribute('data-on')!=='1'){r.setAttribute('data-on','1');r.classList.add('on');r.querySelector('.ck').textContent='\u2611';}biCalc(el);}
function pinTap(el){var n=parseInt(el.getAttribute('data-n'))||0;var bs=el.querySelectorAll('b');
  if(n>=bs.length){for(var i=0;i<bs.length;i++){bs[i].className='o';}el.setAttribute('data-n',0);return;}
  bs[n].className='';el.setAttribute('data-n',n+1);
  if(n+1===bs.length){var d=document.getElementById('toast');
    d.innerHTML='<span class="vn">Đủ 6 số — mã PIN được kiểm tra (băm Argon2id, khóa sau 5 lần sai)</span><span class="fr">6 chiffres — PIN vérifié (hachage Argon2id, blocage après 5 échecs)</span><span class="en">6 digits — PIN checked (Argon2id hash, locked after 5 failures)</span><span class="ht">6 chif — PIN verifye (Argon2id, bloke apre 5 echèk)</span>';
    d.className='show';clearTimeout(window.__tt);window.__tt=setTimeout(function(){d.className='';},2400);}}
function optSel(el){var p=el.parentNode.children;for(var i=0;i<p.length;i++){p[i].classList.remove('sel');}el.classList.add('sel');}
function paneSel(el,g,ix){var root=el.closest('.wf-body')||document;var panes=root.querySelectorAll('.wf-pane[data-g="'+g+'"]');
  for(var k=0;k<panes.length;k++){panes[k].style.display=(panes[k].getAttribute('data-ix')===String(ix))?'':'none';}}
function tabsel(el){var p=el.parentNode.children;for(var i=0;i<p.length;i++){p[i].classList.remove('on');}el.classList.add('on');
  var g=el.getAttribute('data-g');if(!g)return;var ix=el.getAttribute('data-ix');
  var root=el.closest('.wf-body')||document;
  var panes=root.querySelectorAll('.wf-pane[data-g="'+g+'"]');
  for(var k=0;k<panes.length;k++){panes[k].style.display=(panes[k].getAttribute('data-ix')===ix)?'':'none';}}
document.addEventListener('keydown',function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'){e.preventDefault();stepScr(1);}if(e.key==='ArrowLeft'){e.preventDefault();stepScr(-1);}});
/* init */
renderSide();
if(location.hash){var p=location.hash.slice(1).split('-');if(p.length==2&&COMPS[p[0]])showScreen(+p[0],+p[1]);else renderHome();}else renderHome();
</script>
